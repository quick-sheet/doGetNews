<script>
  // Light or dark before anything paints: the saved choice, else the phone's own setting
  (function () {
    var t = null;
    try { t = (JSON.parse(localStorage.getItem('dgn.settings') || '{}') || {}).theme; } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>

<style>
/* Material 3 colour roles. Light and dark only. Tertiary (amber) is our own accent for what's new. */
:root, :root[data-theme="light"] {
  --bg: #F0F4F9; --card: #FFFFFF; --card-2: #E9EEF6; --sheet: #F8FAFD;
  --on: #1F1F1F; --on-var: #444746; --outline: #747775; --outline-var: #C4C7C5;
  --primary: #0B57D0; --on-primary: #FFFFFF; --primary-c: #D3E3FD; --on-primary-c: #041E49;
  --secondary-c: #C2E7FF; --on-secondary-c: #001D35;
  --tertiary: #8A5D00; --tertiary-c: #FFDEA6; --on-tertiary-c: #2A1800;
  --error-c: #FFDAD6; --on-error-c: #410002;
  --inverse: #303030; --on-inverse: #F2F2F2; --inverse-primary: #A8C7FA;
  --scrim: rgba(0, 0, 0, .32);
  /* The floating header, as on the EmailGuru page: the page colour at 82%, frosted, a hairline and a soft shadow */
  --pill: rgba(240, 244, 249, .82); --line: #DCE2EA;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 12px 30px -14px rgba(0, 0, 0, .22);
  /* Back to top, as on the EmailGuru page */
  --btn: #0B0B0C; --on-btn: #FFFFFF;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #131314; --card: #1E1F20; --card-2: #282A2C; --sheet: #1E1F20;
  --on: #E3E3E3; --on-var: #C4C7C5; --outline: #8E918F; --outline-var: #444746;
  --primary: #A8C7FA; --on-primary: #062E6F; --primary-c: #0842A0; --on-primary-c: #D3E3FD;
  --secondary-c: #004A77; --on-secondary-c: #C2E7FF;
  --tertiary: #F2C063; --tertiary-c: #5C4100; --on-tertiary-c: #FFDEA6;
  --error-c: #8C1D18; --on-error-c: #F9DEDC;
  --inverse: #E3E3E3; --on-inverse: #303030; --inverse-primary: #0B57D0;
  --scrim: rgba(0, 0, 0, .55);
  --pill: rgba(19, 19, 20, .8); --line: #2A2B2E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7);
  --btn: #F4F4F5; --on-btn: #0A0A0B;
  color-scheme: dark;
}
:root {
  --sans: "Google Sans Flex", "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  --code: "Google Sans Code", "Roboto Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1);
  --glide: cubic-bezier(.22, 1, .36, 1);
  --navbar: 80px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
/* Long unbroken words (API method paths, resource names, version strings, links) wrap rather than widen the page */
.item, .hero, .sheet, .lc, .empty, .pulse, .notice { overflow-wrap: anywhere; }
body {
  margin: 0; background: var(--bg); color: var(--on); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left); min-height: 100vh; overflow-x: clip;
}
/* Back to top, exactly as on the EmailGuru page: it rises in once you're most of a screen down */
.to-top { position: fixed; z-index: 40; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(var(--navbar) + 1px + env(safe-area-inset-bottom, 0px) + 20px); width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--btn); color: var(--on-btn); cursor: pointer; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .35s, transform .45s var(--glide); }
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
.to-top svg { width: 18px; height: 18px; }
/* Out of the snackbar's way while one shows */
.toasting .to-top.show { transform: translateY(-60px); }

/* Behind the status bar, so nothing scrolls under the clock */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 12px; }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 36rem; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 80px) 16px calc(var(--navbar) + env(safe-area-inset-bottom, 0px) + 24px); position: relative; }
svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }

/* State layers: a soft wash of the content colour on press */
.sl { position: relative; overflow: hidden; isolation: isolate; }
.sl::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s var(--ease); pointer-events: none; border-radius: inherit; z-index: -1; }
.sl:active::after { opacity: .12; }
@media (hover: hover) { .sl:hover::after { opacity: .08; } }

/* Icon buttons: 48px to touch, 40px to see */
.ib { position: relative; flex: none; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; color: var(--on-var); text-decoration: none; }
.ib::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: transparent; transition: background .2s var(--ease), border-radius .2s var(--ease); }
/* Pressed icon buttons morph from a circle to a soft square, as in Material 3 Expressive */
.ib:active::before, .ib:active::after { border-radius: 14px; }
.ib::after { transition: opacity .15s var(--ease), border-radius .2s var(--ease); }
.ib > * { position: relative; }
.ib::after { inset: 4px; }
.ib.filled { color: var(--on-primary); }
.ib.filled::before { background: var(--primary); }
.ib.tonal { color: var(--on-secondary-c); }
.ib.tonal::before { background: var(--secondary-c); }
.ib.big { width: 64px; height: 64px; }
.ib.big::before, .ib.big::after { inset: 4px; border-radius: 18px; }
.star[aria-pressed="true"] { color: var(--tertiary); }
.star .on-i { display: none; }
.star[aria-pressed="true"] .on-i { display: block; }
.star[aria-pressed="true"] .off-i { display: none; }
.star[aria-pressed="true"] svg { animation: pop .4s var(--ease); }
@keyframes pop { 40% { transform: scale(1.25) rotate(-10deg); } }

/* Floating header, after the EmailGuru landing page: a frosted pill that is slightly see-through.
   Search, light/dark and settings glide out of it when the page opens and whenever you scroll up,
   and tuck back in as you scroll down. */
.nav { position: fixed; z-index: 50; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; padding: 0 max(12px, env(safe-area-inset-left, 0px)); }
.pill { pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--pill); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); transition: background-color .4s; }
.logo-btn { display: inline-flex; align-items: center; gap: 9px; min-height: 40px; padding: 0 12px 0 6px; border-radius: 999px; color: var(--on); white-space: nowrap; }
.logo-btn img { height: 24px; width: auto; flex: none; display: block; }
.wordmark { font: 500 16px/1 var(--code); letter-spacing: -.02em; }
.wordmark .par, .wm-g .par { color: var(--on-var); }
/* "news" in Google's own colours: blue, red, yellow, green */
.g1 { color: #4285F4; } .g2 { color: #EA4335; } .g3 { color: #FBBC05; } .g4 { color: #34A853; }
.pill-more { display: grid; grid-template-columns: 0fr; transition: grid-template-columns .55s var(--glide); }
.pill-more > div { min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 2px; white-space: nowrap; opacity: 0; transition: opacity .35s; }
.pill.open .pill-more { grid-template-columns: 1fr; }
.pill.open .pill-more > div { opacity: 1; transition-delay: .12s; }
.pill-sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: 0 0 1px; }
.pb { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; color: var(--on-var); transition: color .2s, background-color .2s, border-radius .2s var(--ease); }
.pb svg.i { width: 20px; height: 20px; }
.pb:active { background: var(--card-2); border-radius: 14px; }
.pb[aria-expanded="true"] { color: var(--on); background: var(--card-2); }
@media (hover: hover) { .pb:hover { color: var(--on); background: var(--card-2); } }
/* The search field drops out below the pill */
.drop { pointer-events: auto; display: flex; align-items: center; margin-top: 8px; width: min(36rem - 32px, 100%); max-width: 100%; height: 52px; padding: 0 4px 0 14px; background: var(--pill); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); color: var(--on-var); animation: dropin .45s var(--glide); }
.drop[hidden] { display: none; }
@keyframes dropin { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
.drop svg.i { width: 20px; height: 20px; }
.drop input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; padding: 0 10px; font-size: 16px; color: var(--on); }
.drop input::placeholder { color: var(--on-var); }
.drop input::-webkit-search-cancel-button { display: none; }
/* Room for the search field, so the first results aren't under it */
.searching .wrap { padding-top: calc(env(safe-area-inset-top, 0px) + 140px); }

/* Bottom navigation bar (Material 3), frosted to match the header */
/* The bottom bar floats like the top pill, and draws in to just its icons as you read down the page */
.navbar { position: fixed; z-index: 40; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; justify-content: center; pointer-events: none; padding: 0 max(12px, env(safe-area-inset-left, 0px)); }
.navbar-in { pointer-events: auto; max-width: 100%; display: flex; align-items: center; gap: 2px; padding: 6px; background: var(--pill); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); transition: background-color .4s; }
.nb { flex: none; width: 74px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 999px; font-size: 12px; line-height: 15px; font-weight: 500; letter-spacing: .01em; color: var(--on-var); transition: width .45s var(--glide), height .45s var(--glide); }
.nb .ind { position: relative; width: 52px; height: 28px; display: grid; place-items: center; border-radius: 14px; transition: width .45s var(--glide); }
.nb .ind::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--secondary-c); transform: scaleX(.4); opacity: 0; transition: transform .35s var(--glide), opacity .2s; }
.nb .ind::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity .15s; }
.nb:active .ind::after { opacity: .12; }
.nb svg.i { position: relative; }
/* The label folds away rather than blinking out */
.nb .lbl { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--glide); }
.nb .lbl > span { min-height: 0; overflow: hidden; opacity: 1; transition: opacity .3s; }
.navbar.tight .nb { width: 52px; height: 40px; }
.navbar.tight .nb .ind { width: 46px; }
.navbar.tight .nb .lbl { grid-template-rows: 0fr; }
.navbar.tight .nb .lbl > span { opacity: 0; transition-duration: .18s; }
.nb[aria-current="page"] { color: var(--on); font-weight: 600; }
.nb[aria-current="page"] .ind { color: var(--on-secondary-c); }
.nb[aria-current="page"] .ind::before { transform: none; opacity: 1; }
.nb .on-i { display: none; }
.nb[aria-current="page"] .on-i { display: block; }
.nb[aria-current="page"] .off-i { display: none; }

/* On the way back up, the time frame and Topics ride in under the pill, so they're reachable anywhere */
.filt { pointer-events: auto; width: min(36rem - 32px, 100%); max-width: 100%; display: grid; grid-template-rows: 0fr; margin-top: 0; opacity: 0;
  transition: grid-template-rows .5s var(--glide), margin-top .5s var(--glide), opacity .3s; }
.filt > div { min-height: 0; overflow: hidden; }
.filt.show { grid-template-rows: 1fr; margin-top: 8px; opacity: 1; }
.filt-row { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 6px 0 7px; background: var(--pill); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid var(--line); border-radius: 25px; box-shadow: var(--shadow); }
.fchips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 36px; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--on-var); box-shadow: inset 0 0 0 1px var(--outline-var); transition: background-color .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease); }
.fchip .n { font-size: 12px; opacity: .7; }
.fchip[aria-checked="true"] { background: var(--secondary-c); color: var(--on-secondary-c); box-shadow: none; }
.fchip[aria-checked="true"] .n { opacity: 1; }
.filt .tbtn { flex: none; height: 36px; padding: 0 10px 0 10px; }
.badge { position: absolute; top: -2px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-size: 11px; line-height: 16px; font-weight: 600; text-align: center; }

/* Notices */
.notice { display: flex; gap: 8px; align-items: center; margin: 4px 0 12px; padding: 8px 4px 8px 16px; border-radius: 16px; background: var(--card-2); font-size: 14px; line-height: 20px; color: var(--on-var); }
.notice p { margin: 0; flex: 1; }

/* When: Today, Yesterday, This week, This month, This quarter. A soft raised surface; the chosen one sits
   on a tonal blue thumb that glides (with a touch of spring) and carries a small Google-colour stripe,
   echoing "news" in the name. Numbers count to their new value when they change. */
.period { position: relative; display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.05fr) minmax(0, 1.05fr) minmax(0, 1.1fr) minmax(0, 1.2fr); padding: 5px; margin: 12px 0 0; border-radius: 26px; background: var(--card);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .04), 0 12px 28px -18px rgba(0, 0, 0, .3); }
:root[data-theme="dark"] .period { box-shadow: 0 0 0 1px var(--line), 0 12px 28px -18px rgba(0, 0, 0, .8); }
.period[hidden] { display: none; }
.seg-ind { position: absolute; top: 5px; bottom: 5px; left: 0; width: var(--w, 0); border-radius: 21px;
  background: linear-gradient(140deg, var(--primary-c), var(--secondary-c));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 3px 10px -4px rgba(11, 87, 208, .45);
  transform: translateX(var(--x, 0)); transition: transform .5s cubic-bezier(.3, 1.25, .5, 1), width .45s var(--glide); }
:root[data-theme="dark"] .seg-ind { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 3px 10px -4px rgba(0, 0, 0, .7); }
.seg-ind::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 20px; height: 3px; margin-left: -10px; border-radius: 2px;
  background: linear-gradient(90deg, #4285F4 0 25%, #EA4335 25% 50%, #FBBC05 50% 75%, #34A853 75%); }
.seg { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; min-height: 70px; padding: 6px 2px 14px; border-radius: 21px; color: var(--on-var); transition: color .25s, transform .15s var(--ease); }
.seg .n { font-size: 22px; line-height: 26px; font-weight: 500; letter-spacing: -.01em; color: var(--on); transition: color .25s; }
.seg .l { font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
.seg[aria-checked="true"], .seg[aria-checked="true"] .n { color: var(--on-secondary-c); }
.seg:active { transform: scale(.95); }
@media (hover: hover) { .seg:not([aria-checked="true"]):hover .n { color: var(--primary); } }
@media (max-width: 370px) { .seg .l { font-size: 11px; } .seg .n { font-size: 19px; } }

/* Hero card, with a little weather of its own: clouds drifting across the top */
.hero { position: relative; overflow: hidden; isolation: isolate; background: var(--card); background: linear-gradient(180deg, color-mix(in srgb, var(--primary-c) 55%, var(--card)) 0, var(--card) 150px); border-radius: 28px; margin: 14px 0 16px; }
:root[data-theme="dark"] .hero { background: var(--card); background: linear-gradient(180deg, color-mix(in srgb, var(--primary-c) 38%, var(--card)) 0, var(--card) 150px); }
.hero[hidden] { display: none; }
.hero-in { position: relative; z-index: 1; padding: 18px 16px 12px 20px; }
.sky { position: absolute; inset: 0 0 auto 0; height: 150px; overflow: hidden; pointer-events: none; z-index: 0; will-change: transform; }
.cloud { position: absolute; left: 0; top: var(--y); width: 170px; height: 64px; opacity: var(--o, 1);
  background:
    radial-gradient(closest-side, var(--cloud), transparent) 0 22px / 80px 42px no-repeat,
    radial-gradient(closest-side, var(--cloud), transparent) 34px 0 / 96px 64px no-repeat,
    radial-gradient(closest-side, var(--cloud), transparent) 86px 14px / 84px 50px no-repeat;
  animation: drift var(--t) linear var(--dl) infinite; }
@keyframes drift { from { transform: translateX(-190px) scale(var(--s)); } to { transform: translateX(600px) scale(var(--s)); } }
:root { --cloud: rgba(255, 255, 255, .95); }
:root[data-theme="dark"] { --cloud: rgba(168, 199, 250, .10); }
.c1 { --y: 6px; --s: .9; --t: 95s; --dl: -24s; }
.c2 { --y: 44px; --s: .62; --t: 125s; --dl: -78s; --o: .85; }
.c3 { --y: 16px; --s: 1.15; --t: 150s; --dl: -118s; --o: .7; }
.eyebrow { margin: 0 0 6px; font-size: 14px; font-weight: 500; color: var(--primary); }
.title-row { display: flex; align-items: flex-start; gap: 4px; }
.title-row > div { flex: 1; min-width: 0; }
.title-row .star { margin: 18px -8px 0 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .01em; color: var(--on-var); }
.h-title { margin: 6px 0 0; font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: -.01em; }
.story { margin: 10px 0 0; font-size: 16px; line-height: 24px; color: var(--on-var); }
.facts { margin: 10px 0 0; font-size: 13px; line-height: 18px; color: var(--on-var); }
.empty-title { margin: 4px 0 0; font-size: 22px; line-height: 28px; font-weight: 500; }
.empty-body { margin: 8px 0 4px; color: var(--on-var); font-size: 15px; }
.acts { display: flex; align-items: center; gap: 2px; margin: 10px 0 0 -4px; }
.acts .hint { margin-left: 8px; font-size: 13px; color: var(--on-var); }

/* Stage labels and the new dot */
.stage { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 600; letter-spacing: .02em; background: var(--card-2); color: var(--on-var); }
.stage.model { background: var(--tertiary-c); color: var(--on-tertiary-c); }
.stage.ga { background: var(--primary-c); color: var(--on-primary-c); }
.stage.deprecated, .stage.breaking { background: var(--error-c); color: var(--on-error-c); }
.new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tertiary); flex: none; }

/* Topics and "New only": one row under the hero, no sideways scrolling */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 0; }
.tbtn { height: 40px; padding: 0 16px 0 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--on-var); box-shadow: inset 0 0 0 1px var(--outline-var); }
.tbtn svg.i { width: 18px; height: 18px; }
.tbtn .tc { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--card-2); color: var(--on-var); font-size: 12px; line-height: 22px; text-align: center; }
.tbtn.on { background: var(--secondary-c); color: var(--on-secondary-c); box-shadow: none; }
.tbtn.on .tc { background: var(--on-secondary-c); color: var(--secondary-c); }
.chip { flex: none; height: 32px; padding: 0 16px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--outline-var); font-size: 14px; font-weight: 500; color: var(--on-var); display: inline-flex; align-items: center; gap: 8px; }
.chip svg.i { width: 18px; height: 18px; margin-left: -8px; display: none; }
.chip[aria-pressed="true"] { background: var(--secondary-c); color: var(--on-secondary-c); box-shadow: none; }
.chip[aria-pressed="true"] svg.i { display: block; animation: checkin .25s var(--ease); }
@keyframes checkin { from { transform: scale(0); opacity: 0; } }
.chip .c { font-size: 12px; opacity: .75; }
.chip .new-dot { margin-left: -4px; }
.chipset { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 4px; }
.pulse { margin: 10px 4px 0; font-size: 14px; line-height: 20px; color: var(--on-var); }
.pulse p { margin: 0; }

/* Lists: grouped cards, rounder at the ends */
.day { display: flex; align-items: baseline; gap: 8px; margin: 22px 4px 8px; font-size: 14px; font-weight: 500; color: var(--on); }
.day .c { font-size: 12px; font-weight: 400; color: var(--on-var); }
.group { display: grid; gap: 2px; }
.group > * { background: var(--card); border-radius: 4px; }
.group > :first-child { border-top-left-radius: 20px; border-top-right-radius: 20px; }
.group > :last-child { border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
.item.open { border-radius: 20px; margin: 6px 0; }
.item-row { display: flex; align-items: flex-start; }
.item-main { flex: 1; min-width: 0; text-align: left; padding: 14px 4px 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; border-radius: inherit; }
.item-title { font-weight: 500; font-size: 16px; line-height: 22px; }
.item-sum { font-size: 14px; line-height: 20px; color: var(--on-var); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item.open .item-sum { display: none; }
.item .star { margin: 4px 0 0; }
.detail { padding: 0 12px 14px 16px; animation: unfold .32s var(--ease) both; }
@keyframes unfold { from { opacity: 0; transform: translateY(-6px); } }
/* Rising into place as they scroll into view */
.rv { opacity: 0; transform: translateY(16px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
.rv.in { opacity: 1; transform: none; }
.detail .story { margin-top: 0; font-size: 15px; line-height: 22px; }
.src { margin: 10px 0 0; font-size: 12px; line-height: 16px; color: var(--on-var); }
.more { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; min-height: 48px; font-size: 14px; font-weight: 500; color: var(--primary); }
.empty { margin: 24px 4px 10px; color: var(--on-var); font-size: 15px; }
/* The end of the list: older days load as you reach it */
.tail { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 64px; margin: 8px 4px 0; font-size: 13px; line-height: 18px; color: var(--on-var); text-align: center; }
.tail p { margin: 0; }

/* Videos and articles */
.media { display: grid; gap: 2px; margin: 12px 0 0; }
.m-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 6px; margin: 0 -6px; border-radius: 16px; text-decoration: none; min-height: 48px; }
.m-thumb { position: relative; flex: none; width: 96px; height: 54px; border-radius: 12px; background: var(--card-2); overflow: hidden; }
.m-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.m-thumb .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; }
.m-thumb .play svg { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .6)); }
.m-icon { flex: none; width: 96px; height: 54px; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; color: var(--on-var); }
.m-txt { min-width: 0; display: grid; gap: 2px; }
.m-title { font-size: 14px; font-weight: 500; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.m-sub { font-size: 12px; line-height: 16px; color: var(--on-var); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group > .m-row { margin: 0; padding: 10px 12px; }

/* Footer */
.foot { display: flex; align-items: flex-start; gap: 8px; margin: 28px 4px 0; font-size: 12px; line-height: 18px; color: var(--on-var); }
.foot div { flex: 1; }
.foot p { margin: 0 0 6px; }
.foot a { color: var(--on); text-underline-offset: 3px; }
.foot .ib { margin: -10px -8px 0 0; }

/* Bottom sheets */
dialog.sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 36rem; max-height: 88vh;
  border: 0; border-radius: 28px 28px 0 0; padding: 0; background: var(--sheet); color: var(--on); overflow: auto; overscroll-behavior: contain;
}
dialog.sheet[open] { animation: rise .3s var(--ease); }
dialog.sheet::backdrop { background: var(--scrim); }
dialog.sheet.springing { transition: transform .22s var(--ease); }
@keyframes rise { from { transform: translateY(48px); opacity: 0; } }
.sheet-in { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); outline: none; }
.grabber { position: relative; width: 72px; height: 22px; margin: 0 auto 2px; }
.grabber::before { content: ""; position: absolute; left: 20px; right: 20px; top: 11px; height: 4px; border-radius: 2px; background: var(--on-var); opacity: .4; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding-left: 8px; }
.sheet-head h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 400; }
.sheet h3 { margin: 22px 8px 8px; font-size: 14px; font-weight: 500; color: var(--primary); }
.sheet p { margin: 6px 0; color: var(--on-var); font-size: 15px; }
.sheet .small { font-size: 13px; line-height: 18px; color: var(--on-var); margin: 0 8px 10px; }
.sheet .group > * { background: var(--card); }
:root[data-theme="light"] .sheet .group > * { background: #FFFFFF; }
.sheet .acts.end { margin: 22px 0 0 0; }
.row { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 12px 8px 16px; text-align: left; width: 100%; text-decoration: none; }
.row .txt { flex: 1; min-width: 0; font-size: 16px; line-height: 22px; }
.row small { display: block; font-size: 13px; line-height: 18px; color: var(--on-var); }
.row .lead { color: var(--on-var); }
.dot-ok, .dot-bad { width: 10px; height: 10px; border-radius: 50%; flex: none; margin: 0 7px; }
.dot-ok { background: var(--primary); }
.dot-bad { background: var(--outline); box-shadow: 0 0 0 3px var(--error-c); }
/* Material switch */
.switch { position: relative; width: 52px; height: 32px; border-radius: 16px; flex: none; background: var(--card-2); box-shadow: inset 0 0 0 2px var(--outline); transition: background .2s var(--ease); }
.switch::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transition: all .2s var(--ease); }
.switch[aria-checked="true"] { background: var(--primary); box-shadow: none; }
.switch[aria-checked="true"]::after { top: 4px; left: 24px; width: 24px; height: 24px; background: var(--on-primary); }
.welcome { padding: 4px 8px 0; }
.welcome .logo { width: auto; height: 56px; display: block; margin: 6px 0 16px; }
.welcome h2 { margin: 0 0 8px; font-size: 28px; line-height: 36px; font-weight: 400; }
.welcome h2 code, .wm { font-family: var(--code); font-weight: 500; letter-spacing: -.02em; }
.welcome .lede { color: var(--on); font-size: 18px; line-height: 26px; font-weight: 500; }
.welcome p { font-size: 16px; line-height: 24px; color: var(--on-var); }
.welcome .sig { margin-top: 14px; color: var(--on); font-weight: 500; }
.welcome .sig a { text-underline-offset: 3px; }
.welcome .acts { margin-top: 18px; }

/* Learn: Daily Drift's own screen, full height over the app, showing a set of three from Google's docs.
   If Daily Drift can't be reached, a plain card in doGet(news)'s own style takes its place. */
.learning, .learning body { overflow: hidden; }
.learn { position: fixed; inset: 0; z-index: 70; background: var(--bg); opacity: 0; transition: opacity .35s var(--ease); }
.learn.open { opacity: 1; }
.learn[hidden] { display: none; }
.learn-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .6s var(--ease); background: transparent; }
.learn.ready .learn-frame { opacity: 1; }
.learn-load { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--on-var); font-size: 15px; transition: opacity .4s; }
.learn.ready .learn-load, .learn.card .learn-load { opacity: 0; pointer-events: none; }
.learn-load img { height: 56px; width: auto; animation: bob 2.4s ease-in-out infinite; }
.learn-card { position: absolute; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
.learn-card[hidden] { display: none; }
.lc-top { display: flex; align-items: center; gap: 4px; padding: 8px 8px 4px; max-width: 36rem; width: 100%; margin: 0 auto; }
.lc-kicker { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px 0 14px; border-radius: 20px; font-size: 14px; font-weight: 500; color: var(--primary); text-align: left; }
.lc-kicker span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc-kicker svg.i { width: 20px; height: 20px; }
.lc-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.lc-in { max-width: 36rem; margin: 0 auto; padding: 4px 16px calc(32px + env(safe-area-inset-bottom, 0px)); transition: transform .3s var(--glide), opacity .3s; }
.lc-pull { height: 0; overflow: hidden; display: grid; place-items: center; font-size: 13px; color: var(--on-var); }
.lc-part { background: var(--card); border-radius: 24px; padding: 16px 16px 10px 18px; margin: 10px 0 0; animation: rise .45s var(--glide) both; }
.lc-part[data-k="1"] { animation-delay: .06s; } .lc-part[data-k="2"] { animation-delay: .12s; }
.lc-label { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 6px; font-size: 11px; font-weight: 600; letter-spacing: .03em; background: var(--secondary-c); color: var(--on-secondary-c); }
.lc-part[data-k="1"] .lc-label { background: var(--tertiary-c); color: var(--on-tertiary-c); }
.lc-part[data-k="2"] .lc-label { background: var(--primary-c); color: var(--on-primary-c); }
.lc-part h2 { margin: 8px 0 0; font-size: 20px; line-height: 26px; font-weight: 500; }
.lc-part p { margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--on-var); }
.lc-part pre { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--card-2); overflow-x: auto; font: 400 13px/19px var(--code); color: var(--on); }
.lc-credit { margin: 14px 4px 0; font-size: 12px; line-height: 16px; color: var(--on-var); }
.lc-next { display: flex; align-items: center; gap: 8px; margin: 14px auto 0; height: 40px; padding: 0 18px 0 14px; border-radius: 20px; font-size: 14px; font-weight: 500; color: var(--on-secondary-c); background: var(--secondary-c); }
.lc-empty { margin: 40px 8px 0; text-align: center; color: var(--on-var); font-size: 15px; }
.lc-empty img { height: 56px; width: auto; display: block; margin: 0 auto 14px; }
.lq { display: flex; align-items: center; gap: 4px; height: 48px; margin: 0 4px; padding: 0 4px 0 14px; border-radius: 24px; background: var(--card); box-shadow: inset 0 0 0 1px var(--outline-var); }
.lq input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--on); }
.lq-out { margin: 10px 8px 0; font-size: 14px; color: var(--on-var); }
.lq-out a { color: var(--primary); }
.lq-out ul { margin: 6px 0 0; padding-left: 18px; }
.lq-out li { margin: 4px 0; }

/* Loading: the rainbow cloud floats gently while the brief arrives */
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 0 18px; }
.loading img { height: 56px; width: auto; animation: bob 2.4s ease-in-out infinite; }
.loading p { margin: 0; font-size: 15px; color: var(--on-var); }
@keyframes bob { 50% { transform: translateY(-7px) scale(1.04); } }
@keyframes breathe { 50% { opacity: .45; } }

/* Spinner: a comet */
.spinner { border-radius: 50%; background: conic-gradient(from 90deg, transparent 10%, currentColor 95%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px)); animation: spin .8s linear infinite; }
.spinner { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 8px; color: var(--primary); }
@keyframes spin { to { transform: rotate(1turn); } }

/* Snackbar: a popover, so it shows above open sheets; it sits just above the navigation bar */
.toast { position: fixed; inset: auto auto calc(var(--navbar) + 12px + env(safe-area-inset-bottom)) 50%; margin: 0; border: 0; width: min(560px, calc(100% - 32px));
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: var(--inverse); color: var(--on-inverse); padding: 14px 16px; border-radius: 8px;
  font-size: 14px; line-height: 20px; text-align: left; transition: opacity .2s var(--ease), transform .2s var(--ease); z-index: 30; overflow: visible;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Brief me: Gemini writes and reads a briefing, on the person's own key */
.ai-btn { margin-left: auto; background: var(--primary-c); color: var(--on-primary-c); box-shadow: none; }
.ai-btn svg.i { width: 18px; height: 18px; }
.ai .ai-scope { margin: 2px 8px 10px; }
.ai-len { display: flex; gap: 8px; padding: 0 4px; }
.ai-ctl { display: flex; align-items: center; gap: 4px; margin: 14px 0 4px; }
.ai-ctl .ib[disabled], .mini .ib[disabled] { opacity: .38; pointer-events: none; }
.ai-time { flex: 1; min-width: 0; margin-left: 6px; font-size: 13px; color: var(--on-var); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-rate { height: 32px; min-width: 48px; padding: 0 10px; border-radius: 16px; font-size: 13px; font-weight: 500; color: var(--on-var); box-shadow: inset 0 0 0 1px var(--outline-var); }
.sheet .ai-status { margin: 6px 8px 0; min-height: 22px; font-size: 14px; }
.ai-status small { display: block; margin-top: 4px; color: var(--on-var); font-size: 13px; }
.ai-status .err { color: var(--on-error-c); background: var(--error-c); display: block; padding: 10px 14px; border-radius: 14px; }
.ai-status .acts { margin-top: 8px; }
.ai-text { margin: 8px 0 4px; }
.sheet .ai-title { margin: 14px 8px 8px; font-size: 20px; line-height: 26px; font-weight: 500; color: var(--on); }
.ai-sec { margin: 0 0 4px; padding: 6px 12px; border-radius: 16px; transition: background-color .35s var(--ease); }
.ai-sec h4 { margin: 4px 0 2px; font-size: 14px; font-weight: 500; color: var(--primary); }
.sheet .ai-sec p { margin: 2px 0 4px; color: var(--on); font-size: 16px; line-height: 24px; }
.ai-sec.now { background: var(--card); box-shadow: inset 3px 0 0 var(--primary); }
:root[data-theme="dark"] .ai-sec.now { background: var(--card-2); }
.ai-refs { display: flex; flex-direction: column; gap: 2px; margin: 6px 0 4px; }
.ai-ref { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 10px; border-radius: 10px; text-align: left; font-size: 13px; line-height: 18px; color: var(--primary); }
.ai-ref svg.i { width: 16px; height: 16px; }
.ai-ref span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ai-wait { display: flex; gap: 6px; padding: 18px 12px; }
.ai-wait i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); opacity: .3; animation: aiwait 1.2s ease-in-out infinite; }
.ai-wait i:nth-child(2) { animation-delay: .15s; } .ai-wait i:nth-child(3) { animation-delay: .3s; }
@keyframes aiwait { 40% { opacity: 1; transform: translateY(-4px); } }
/* The briefs made earlier today, so a change of filters doesn't put one out of reach */
.ai-past { margin: 16px 0 2px; padding-top: 12px; border-top: 1px solid var(--outline-var); }
.ai-past .small { margin: 0 8px 8px; }
.ai-past-row { display: flex; gap: 8px; padding: 2px 4px 4px; overflow-x: auto; scrollbar-width: none; }
.ai-past-row::-webkit-scrollbar { display: none; }
.ai-past-row .chip { flex: 0 0 auto; max-width: 86%; }
.ai-past-row .chip small { margin-left: 6px; padding: 1px 6px; border-radius: 8px; background: var(--card-2); color: var(--on-var); font-size: 11px; }
.ai-note { margin-top: 14px !important; }
.sheet h4.sub { margin: 16px 8px 8px; font-size: 13px; font-weight: 500; color: var(--on-var); }
.sheet .small a { color: var(--primary); }
.item.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--primary); } }
/* The brief's mini player, above the navigation bar while the sheet is closed */
.mini { position: fixed; z-index: 45; left: 0; right: 0; margin: 0 auto; bottom: calc(var(--navbar) + 10px + env(safe-area-inset-bottom, 0px)); width: min(36rem, calc(100% - 24px));
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 28px; background: var(--primary-c); color: var(--on-primary-c); box-shadow: var(--shadow); animation: rise .3s var(--ease); }
.mini[hidden] { display: none; }
.mini .ib { color: inherit; }
.mini-txt { flex: 1; min-width: 0; text-align: left; padding: 4px 8px; border-radius: 16px; line-height: 18px; }
.mini-txt b { display: block; font-size: 14px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mini-txt small { display: block; font-size: 12px; opacity: .8; }
.mini-on .to-top.show { transform: translateY(-68px); }
.mini-on .toast { bottom: calc(var(--navbar) + 80px + env(safe-area-inset-bottom)); }

/* Opening the installed app: the phone's still launch image hands over to the cloud bobbing, as Learn's loader
   does, then fades into the brief */
.boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px; background: var(--bg); transition: opacity .45s var(--ease); }
.boot img { height: 84px; width: auto; animation: bob 2.4s ease-in-out infinite; }
.boot .wordmark { font-size: 22px; }
.boot.gone { opacity: 0; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rv { opacity: 1; transform: none; }
  .spinner { animation: spin 1.6s linear infinite !important; }
  .loading img, .learn-load img, .boot img { animation: breathe 2.4s ease-in-out infinite !important; }   /* still, just a slow fade */
  .boot { transition: opacity .3s !important; }
}
</style>
</head>
<body>
<div class="boot" id="boot" aria-hidden="true"><img src="logo.png" alt="" width="132" height="84"><span class="wordmark">doGet<span class="par">(</span><span class="g1">n</span><span class="g2">e</span><span class="g3">w</span><span class="g4">s</span><span class="par">)</span></span></div>
<script>
  // Only when opened as the installed app, where the phone shows its own still launch image first
  (function () { try { if (!(matchMedia('(display-mode: standalone)').matches || navigator.standalone)) document.getElementById('boot').remove(); } catch (e) { document.getElementById('boot').remove(); } })();
</script>
<header class="nav" id="nav">
  <div class="pill" id="pill">
    <button class="logo-btn sl" id="logoBtn" type="button" aria-label="doGet(news). Back to the top">
      <img src="logo.png" alt="" width="38" height="24">
      <span class="wordmark" aria-hidden="true">doGet<span class="par">(</span><span class="g1">n</span><span class="g2">e</span><span class="g3">w</span><span class="g4">s</span><span class="par">)</span></span>
    </button>
    <div class="pill-more" id="pillMore">
      <div id="pillTools">
        <span class="pill-sep" aria-hidden="true"></span>
        <button class="pb" id="searchBtn" type="button" aria-label="Search" title="Search" aria-expanded="false" aria-controls="searchRow"></button>
        <button class="pb" id="themeBtn" type="button"></button>
        <button class="pb" id="settingsBtn" type="button" aria-label="Settings" title="Settings"></button>
      </div>
    </div>
  </div>
  <div class="filt" id="pillFilters"><div><div class="filt-row" id="pillFiltersIn"></div></div></div>
  <div class="drop" id="searchRow" role="search" hidden>
    <span id="searchIcon"></span>
    <label class="vh" for="q">Search three months of updates, products and videos</label>
    <input id="q" type="search" placeholder="Search three months" autocomplete="off" enterkeyhint="search">

</header>
<div class="wrap">
  <div id="notices"></div>
  <main>
    <div class="period" id="period" role="radiogroup" aria-label="Show updates from" data-rv="period" hidden></div>
    <div id="bar"></div>
    <section class="hero" id="hero" data-rv="hero"><div class="sky" id="sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div><div class="hero-in" id="heroIn" aria-live="polite"></div></section>
    <div id="list"></div>
    <div class="tail" id="tail"></div>
  </main>

/* ---------- The anonymous pulse ----------

   separate Apps Script folds into running totals and then throws away. Nothing identifies anyone, nothing
   is kept per visitor, and no two beacons are ever joined up. An empty PULSE_URL sends nothing. */
const pulse = (() => {
  if (!PULSE_URL) return { on: false, link() {} };
  const send = (b) => {
    b.k = 'dgn1';
    try { navigator.sendBeacon(PULSE_URL, new Blob([JSON.stringify(b)], { type: 'text/plain;charset=UTF-8' })); }
    catch (e) { /* a count is never worth an error */ }
  };
  const ua = navigator.userAgent || '';
  const dev = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android'
    : /Macintosh|Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux|CrOS/.test(ua) ? 'Linux' : 'Other';
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { tz = ''; }
  send({ t: 'open', dev, tz, lang: navigator.language || '', pwa: standalone });

    const dur = Math.round((Date.now() - at) / 1000);
    if (!first && dur < 2 && !hosts.length) return;   // flicking away and back is not a visit
    send({ t: 'end', dur, first, links: hosts });
    first = false; at = Date.now(); hosts = [];
  };

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') end(); });
  return { on: true, link: (url) => { const h = C.hostOf(url); if (h && hosts.length < 8 && hosts.indexOf(h) < 0) hosts.push(h); } };
})();

  if (S.arch === 'idle') idle(() => loadArchive());
}

let archP = null;
function loadArchive() {
  if (!S.brief || !S.brief.archive || S.arch === 'done') return Promise.resolve();

  S.arch = 'loading';

      if (S.brief === b) S.arch = 'done';
    } catch { if (S.brief === b) S.arch = 'failed'; }

    if (S.brief !== b) return;

  const dismissed = get('dismissed', {});
  const x = `<button class="ib sl" type="button" data-dismiss="install" aria-label="Dismiss" title="Dismiss">${icon('close')}</button>`;
  if (S.brief && C.isStale(S.brief.generated, now())) {
    out.push(`<div class="notice"><p>This brief is from ${esc(C.longDate(S.brief.generated))}. The daily update may have paused, so the newest releases could be missing.</p></div>`);
  } else if (S.brief && (S.saved || navigator.onLine === false)) {
    out.push(`<div class="notice"><p>No connection just now. Showing the brief ${esc(C.updatedTxt(S.brief.generated, now()).replace(/^Updated/, 'updated'))}.</p></div>`);
  }
  if (!standalone && !dismissed.install) {
    if (S.installEvt) out.push(`<div class="notice"><p>Add ${NAME} to your home screen for one-tap access.</p><button class="ib sl tonal" type="button" data-act="install" aria-label="Install" title="Install">${icon('install')}</button>${x}</div>`);
    else if (isIOS) out.push(`<div class="notice"><p>Add ${NAME} to your Home Screen: tap Share, then Add to Home Screen.</p>${x}</div>`);
  }
  $('#notices').innerHTML = out.join('');
}

// Today, Yesterday, This week, This month, This quarter: built once, then updated in place so the fill can glide
function periodCounts() {
  const base = S.view === 'watch' ? mediaAll().filter((x) => C.inTopics(x, S.topics))
    : C.filter(S.brief.items, { topics: S.topics, quiet: S.set.quiet, onlyNew: S.onlyNew, since: S.since });
  return C.periodCounts(base, now());
}
function renderPeriod() {
  const el = $('#period');
  if (!S.brief || S.view === 'stars' || searchingNow()) { el.hidden = true; return; }
  el.hidden = false;
  if (!el.children.length) {
    el.innerHTML = `<span class="seg-ind" aria-hidden="true"></span>` + C.PERIODS.map((p) =>
      `<button class="seg" type="button" role="radio" data-period="${p.id}"><span class="n num"></span><span class="l">${esc(p.n)}</span></button>`).join('');
  }
  const counts = periodCounts();
  const what = S.view === 'watch' ? ['video or article', 'videos and articles'] : ['update', 'updates'];
  C.PERIODS.forEach((p, i) => {
    const b = el.querySelector(`[data-period="${p.id}"]`), on = S.period === p.id;
    b.setAttribute('aria-checked', String(on));
    b.tabIndex = on ? 0 : -1;
    countTo(b.querySelector('.n'), counts[p.id]);
    b.setAttribute('aria-label', `${p.n}: ${C.plural(counts[p.id], what[0], what[1])}`);
  });
  placeFill();
}
// A number counts up or down to its new value; data-n always holds the value itself
function countTo(el, n) {
  const from = el.dataset.n == null ? 0 : +el.dataset.n;
  el.dataset.n = n;
  cancelAnimationFrame(el._raf);
  const show = (v) => { el.textContent = Math.round(v).toLocaleString('en-GB'); };
  if (reduced() || from === n) { show(n); return; }
  const t0 = performance.now(), dur = 650;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    show(from + (n - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}
// The fill sits under the chosen button, measured, since the buttons differ in width
function placeFill() {
  const el = $('#period'), b = el.querySelector('[aria-checked="true"]');
  if (!b || el.hidden) return;
  el.style.setProperty('--x', b.offsetLeft + 'px');
  el.style.setProperty('--w', b.offsetWidth + 'px');
}
addEventListener('resize', placeFill);
function setPeriod(id) {
  if (id === S.period) return;
  S.period = C.cleanPeriod(id); put('period', S.period);
  S.open = null; S.days = DAYS_STEP;
  freshView();
  render();
}
const periodWord = () => C.PERIODS.find((p) => p.id === S.period).from;

let heroId = null;
function renderHero() {
  const box = $('#hero'), el = $('#heroIn');

    || (fromLatest && C.dayKey(S.brief.latestRun) === C.dayKey(now()) ? 'Top of today’s brief' : 'Top of the brief');
  const nv = (it.v || []).filter((id) => S.brief.videos[id]).length, na = (it.ar || []).filter((id) => S.brief.articles[id]).length;
  const extra = [nv ? C.plural(nv, 'video', 'videos') : '', na ? C.plural(na, 'article', 'articles') : ''].filter(Boolean).join(' and ').replace(/(\d) /g, '$1 ');

    <p class="facts">From ${esc(S.brief.srcName[it.src] || 'Google')} on ${esc(C.longDate(it.d))}.${extra ? ` ${esc(extra)} go${nv + na === 1 ? 'es' : ''} with it.` : ''}</p>

}

function renderBar() {

function dayBlock(d, rows, more) { return `<h2 class="day" data-rv="d${S.view}${d.key}">${esc(d.label)}<span class="c num">${d.items.length}</span></h2><div class="group">${rows}${more || ''}</div>`; }

// Days are shown a fortnight at a time; S.dayTotal says how many there are, for the tail
function renderList() {
  const el = $('#list');
  S.dayTotal = 0;
  if (S.view === 'watch') return renderWatch(el);
  if (S.view === 'stars') return renderStars(el);
  if (!S.brief) { el.innerHTML = ''; return; }
  const searching = searchingNow();
  const list = briefList(true).filter((x) => searching || x.id !== heroId);
  if (!list.length) {
    el.innerHTML = searching ? `<p class="empty">Nothing matches “${esc(S.q.trim())}”. Try a product name, like BigQuery or Gmail.</p>` : '';
    return;
  }
  const days = C.group(list, now());
  S.dayTotal = days.length;
  el.innerHTML = days.slice(0, S.days).map((d) => {
    const all = !!S.more[d.key] || searching;
    const shown = all ? d.items : d.items.filter((x, i) => i < PER_DAY || x.id === S.open);
    const hidden = d.items.length - shown.length;
    const more = hidden > 0 ? `<button class="more sl" type="button" data-more="${d.key}">Show ${hidden} more${icon('more')}</button>`
      : (S.more[d.key] && !searching && d.items.length > PER_DAY ? `<button class="more sl" type="button" data-more="${d.key}">Show fewer${icon('less')}</button>` : '');
    return dayBlock(d, shown.map(itemHtml).join(''), more);

function renderWatch(el) {
  const list = mediaList();
  if (!list.length) {
    el.innerHTML = `<p class="empty">${searchingNow() ? `No videos or articles match “${esc(S.q.trim())}”.` : `No videos or articles ${S.topics.length ? 'for these topics ' : ''}from ${esc(periodWord())} yet.`}</p>`;
    return;
  }
  const days = C.group(list, now());
  S.dayTotal = days.length;
  el.innerHTML = days.slice(0, S.days).map((d) => dayBlock(d, d.items.sort((a, b) => b.d - a.d).map((x) => (x.kind === 'video' ? videoRow(x) : articleRow(x))).join(''))).join('');
}

function renderStars(el) {
  // Use today's copy of a starred update when it's still in the brief, so its videos show too
  const list = starList().map((x) => (S.brief && S.brief.items.find((i) => i.id === x.id)) || x);
  if (!list.length) {
    el.innerHTML = `<p class="empty">${S.q.trim() ? `No starred updates match “${esc(S.q.trim())}”.` : 'Nothing starred yet. Tap the star on any update to keep it here, even after it leaves the brief.'}</p>`;
    return;
  }
  el.innerHTML = C.group(list, now()).map((d) => dayBlock(d, d.items.map(itemHtml).join(''))).join('');
}

// The end of the list: more days as you reach it, then the archive, then a word about how far back it goes
let tailIO = null;
function renderTail() {
  const el = $('#tail');
  el.className = 'tail';
  const watchTail = () => {
    if (!('IntersectionObserver' in window)) return;
    if (!tailIO) tailIO = new IntersectionObserver((en) => { if (en.some((e) => e.isIntersecting)) nextDays(); }, { rootMargin: '0px 0px 600px 0px' });
    tailIO.unobserve(el);
    requestAnimationFrame(() => tailIO.observe(el));   // observing again reports straight away if it's still on screen
  };
  // A period that starts inside the last two weeks is all in brief.json, so it needs nothing older
  const r = searchingNow() ? null : range();
  const needsOlder = !r || !S.brief || r.from < S.brief.generated - S.brief.keepDays * 864e5;
  const pending = needsOlder && (S.arch === 'idle' || S.arch === 'loading');
  if (!S.brief || S.view === 'stars' || (!S.dayTotal && !pending)) { el.innerHTML = ''; return; }
  if (S.days < S.dayTotal) {
    el.classList.add('more');
    el.innerHTML = `<p><span class="spinner" aria-hidden="true"></span>Older days</p>`;
    watchTail();
    return;
  }
  if (pending) {
    el.innerHTML = `<p><span class="spinner" aria-hidden="true"></span>Loading older updates…</p>`;
    if (S.arch === 'idle') loadArchive();
    return;
  }
  if (S.arch === 'failed' && needsOlder) {
    el.innerHTML = `<p>Couldn’t load the older updates.</p><button class="ib sl" type="button" data-act="archive" aria-label="Try again" title="Try again">${icon('refresh')}</button>`;
    return;
  }
  const items = S.brief.items;
  const oldest = items.length ? items[items.length - 1].d : now();
  if (r) {
    // History still filling in (the first weeks after setting up): say so rather than "everything"
    const short = needsOlder && oldest > r.from + 864e5;
    el.innerHTML = `<p>${short ? `That’s everything so far. ${NAME} keeps three months, and fills in a day at a time.` : `That’s everything from ${esc(periodWord())}.`}</p>`;
    return;
  }
  const full = now() - oldest > 80 * 864e5;
  const what = searchingNow() ? 'every match from the last three months' : S.view === 'watch' ? 'three months of videos and articles' : 'three months of updates';
  el.innerHTML = `<p>${full ? `That’s ${what}.` : `That’s everything so far. ${NAME} keeps three months, and fills in a day at a time.`}</p>`;
}
function nextDays() {
  if (S.days >= S.dayTotal) return;
  S.days += DAYS_STEP;
  renderList(); renderTail(); reveal();
}

/* ---------- Motion, kept light ---------- */
// Cards, day headings and the hero rise into place the first time they scroll into view.
// Anything already seen this visit is simply shown, so opening an update or starring never replays it.
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const seen = new Set();
let io = null;
function reveal() {
  const fresh = [];
  document.querySelectorAll('[data-rv]:not(.in)').forEach((el) => {
    if (reduced() || !('IntersectionObserver' in window) || seen.has(el.dataset.rv)) { el.classList.add('in'); return; }
    if (!el.classList.contains('rv')) { el.classList.add('rv'); fresh.push(el); }
  });
  if (!fresh.length) return;
  if (!io) io = new IntersectionObserver((entries) => {
    entries.filter((en) => en.isIntersecting).forEach((en, j) => {
      // Those arriving together come in one after another
      en.target.style.transitionDelay = Math.min(j, 6) * 45 + 'ms';
      en.target.classList.add('in');
      seen.add(en.target.dataset.rv);
      io.unobserve(en.target);
      setTimeout(() => { en.target.style.transitionDelay = ''; }, 900);
    });
  }, { rootMargin: '0px 0px -6% 0px' });
  fresh.forEach((el) => io.observe(el));
}
// A new view starts fresh, so its cards rise in
function freshView() { seen.forEach((k) => { if (k !== 'hero') seen.delete(k); }); }

/* ---------- The floating header ---------- */
// Open: the tools glide out of the pill. They tuck away as you scroll down and come back as you scroll up,
// or when you tap the pill. They stay out while searching, at the top of the page, and with reduced motion.
const pill = $('#pill');
const filtersFit = () => !!S.brief && S.view !== 'stars' && !searchingNow() && !S.searching;
// The page's own selector is still in view, so there's nothing to bring along yet
const filtersNeeded = () => filtersFit() && !$('#period').hidden && $('#period').getBoundingClientRect().bottom < 108;
function setFilters(show) {
  const el = $('#pillFilters'), on = !!show && filtersNeeded();
  if (on && !el.classList.contains('show')) renderPillFilters();
  el.classList.toggle('show', on);
  el.inert = !on;
}
function setPill(open) {
  if (!open && (S.searching || reduced() || scrollY < 40 || pill.contains(document.activeElement) && document.activeElement !== $('#logoBtn'))) open = true;
  pill.classList.toggle('open', open);
  setFilters(open);
  $('#pillTools').inert = !open;
  $('#logoBtn').setAttribute('aria-label', open ? `${NAME}. Back to the top` : `${NAME}. Show search, theme and settings`);
}
// Reading down draws the bottom bar in to its icons; coming back up opens it out again
function setNavbar(tight) {
  $('#navbar').classList.toggle('tight', !!tight && !reduced());
}
let lastY = scrollY, ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const y = scrollY, dy = y - lastY;
    if (!reduced() && y < 700) $('#sky').style.transform = `translateY(${(y * 0.35).toFixed(1)}px)`;   // the clouds drift a little slower than the page
    $('#toTop').classList.toggle('show', y > innerHeight * 0.8);
    if (y < 40) { setPill(true); setNavbar(false); lastY = y; return; }
    if (Math.abs(dy) < 8) return;
    setPill(dy < 0);
    setNavbar(dy > 0);
    lastY = y;
  });
}, { passive: true });
$('#toTop').addEventListener('click', () => scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }));
$('#logoBtn').addEventListener('click', () => {
  if (!pill.classList.contains('open')) { setPill(true); lastY = scrollY; return; }
  scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
});

  const inner = $('#lcIn', sc), hint = $('#lcPull', sc);
  sc.addEventListener('touchstart', (e) => { y0 = sc.scrollTop <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  sc.addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { inner.style.transform = ''; return; }
    e.preventDefault();
    const d = Math.min(110, dy * 0.5);
    if (!reduced()) inner.style.transform = `translateY(${d}px)`;
    hint.style.height = d > 30 ? '28px' : '0';

/* ---------- Brief me: Gemini writes and reads a briefing, on the person's own key ---------- */
// The key, voice and length live on this phone only (localStorage). Gemini is called straight from
// here; nothing goes through Apps Script or GitHub. A brief and its recording are kept for the day,
// so playing it again costs nothing.
const Gm = window.Gem;
const AI = Object.assign({ key: '', voice: 'Charon', len: 'short', rate: 1, models: null, form: '' }, get('gemini', {}));
const saveAI = () => put('gemini', { key: AI.key, voice: AI.voice, len: AI.len, rate: AI.rate, models: AI.models, form: AI.form });
const aiOn = () => !!AI.key;
const RATES = [1, 1.25, 1.5];
let run = null;            // the brief being written, recorded or played
const aud = new Audio();   // one player for every part, so the lock screen keeps its controls
aud.preload = 'auto';
const SILENCE = URL.createObjectURL(new Blob([Gm.wav(new Uint8Array(2400), 24000)], { type: 'audio/wav' }));
// A tap starts a moment of silence, so the phone lets the brief play once it's ready
function unlock() { if (aud.getAttribute('src')) return; aud.src = SILENCE; const p = aud.play(); if (p) p.catch(() => {}); }
const isSilence = () => aud.getAttribute('src') === SILENCE;
const aiDay = () => String(C.dayKey(now()));
function hashStr(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h >>> 0).toString(36); }

// Today's written briefs, by what they cover. Each keeps the words that name it, so a brief made under
// one set of filters can be found again under another.
function textCache() { const c = get('aitext', null); return c && c.day === aiDay() ? c : { day: aiDay(), items: {} }; }
function keepText(key, brief, about) {
  const c = textCache();
  c.items[key] = Object.assign({ at: now(), brief }, about || {});
  const keys = Object.keys(c.items).sort((a, b) => c.items[b].at - c.items[a].at);
  keys.slice(12).forEach((k) => delete c.items[k]);
  put('aitext', c);
}
// Today's briefs, newest first
// A brief made before the app kept the words that name it still counts: the time it was made will do
const briefsToday = () => { const c = textCache(); return Object.keys(c.items).map((k) => Object.assign({ key: k }, c.items[k])).filter((x) => x.brief).sort((a, b) => b.at - a.at); };
const briefName = (x) => x.short || x.label || ('Made at ' + C.time(x.at));
// Whether a brief still has its recording on this phone
const hasClip = (key) => get('aiclips', []).some((b) => String(b).indexOf(key + '|') === 0);
// Today's recordings, in IndexedDB: the three most recent briefs
const DB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    try { const q = indexedDB.open('dgn-ai', 1); q.onupgradeneeded = () => q.result.createObjectStore('clips'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }
    catch (e) { rej(e); }
  }));
  const go = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction('clips', mode), q = fn(t.objectStore('clips'));
    t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error);
  }));
  return {
    get: (k) => go('readonly', (st) => st.get(k)).catch(() => null),
    put: (k, v) => go('readwrite', (st) => st.put(v, k)).catch(() => null),
    keys: () => go('readonly', (st) => st.getAllKeys()).catch(() => []),
    del: (ks) => go('readwrite', (st) => { ks.forEach((k) => st.delete(k)); }).catch(() => null),
    clear: () => go('readwrite', (st) => st.clear()).catch(() => null),
  };
})();
async function keepClip(base, i, blob) {
  await DB.put(base + '#' + i, { at: now(), blob });
  const bases = get('aiclips', []).filter((b) => b !== base && b.indexOf(aiDay() + '|') === 0).slice(-2).concat([base]);
  put('aiclips', bases);
  const keys = await DB.keys();
  const gone = (keys || []).filter((k) => bases.indexOf(String(k).split('#')[0]) < 0);
  if (gone.length) DB.del(gone);
}

// What the brief covers, in words: for Gemini, and for the sheet
function aiScope() {
  const p = C.PERIODS.find((x) => x.id === S.period), r = range();
  const when = S.period === 'today' ? 'Today, ' + C.longDate(now()) : S.period === 'yesterday' ? 'Yesterday, ' + C.longDate(r.from) : p.n + ', since ' + C.longDate(r.from);
  return when + (S.onlyNew ? ', only what’s new since the last visit' : '');
}
const aiLabel = (n) => [C.PERIODS.find((x) => x.id === S.period).n, C.plural(n, 'update', 'updates'), S.topics.length ? andList(topicNames()) : '', S.onlyNew ? 'new only' : ''].filter(Boolean).join(' · ');
// Short enough for a chip: what it covers, without the count
const aiShort = () => [C.PERIODS.find((x) => x.id === S.period).n, S.topics.length ? andList(topicNames()) : '', S.onlyNew ? 'new only' : '', AI.len === 'short' ? '' : Gm.LENGTHS[AI.len].n].filter(Boolean).join(' · ');

// What a brief of what's on screen right now would be
function aiAsked() {
  const items = briefList(false);
  if (!items.length) return null;
  const req = Gm.request(items, {
    len: AI.len, scope: aiScope(), topics: S.topics.length ? andList(topicNames()) : '',
    stage: (st) => C.STAGES[st] || '', track: (tr) => C.TRACK_NAME[tr] || '',
    src: (it) => [S.brief.srcName[it.src], C.shortDate(it.d)].filter(Boolean).join(', '),
  });
  return { req, key: aiDay() + '|' + AI.len + '|' + hashStr(req.used.map((x) => x.id).join(',')), label: aiLabel(items.length), short: aiShort() };
}

// Brief me: whatever you last read is what opens, however the filters have moved since. Making one for

function aiOpen() {
  if (!aiOn() || !S.brief) return;
  if (run && run.state !== 'failed') { openAI(); return; }
  const asked = aiAsked();
  if (asked && textCache().items[asked.key]) { openPast(asked.key); return; }
  const last = briefsToday()[0];
  if (last) { openPast(last.key); return; }
  aiStart();

function aiStart(fresh) {
  if (!aiOn() || !S.brief) return;
  const asked = aiAsked();
  if (!asked) { toast('Nothing to brief on here. Try a longer stretch.'); return; }
  const { req, key } = asked;
  if (run && run.key === key && !fresh && run.state !== 'failed') { openAI(); return; }   // the same brief: show it as it is
  stopRun();
  unlock();
  run = { key, len: AI.len, label: asked.label, short: asked.short, voice: AI.voice, brief: null, parts: [], i: 0, state: 'writing', err: null, ttsErr: null, ac: new AbortController(), playing: false, waiting: false, done: false, started: now() };

  setTimeout(() => { if (run === mine && mine.state === 'writing') paintAI(); }, 15000);
  makeRun(run, req, fresh);
}

async function aiModels(cli, signal, again) {
  const fresh = AI.models && AI.models.at && now() - AI.models.at < 7 * 864e5;
  if (fresh && !again) return AI.models;
  try { AI.models = await cli.models(signal); saveAI(); }
  catch (e) { if (e.name === 'AbortError' || /key|denied|region/.test(e.kind)) throw e; if (!AI.models) AI.models = Object.assign({ at: 0 }, Gm.FALLBACK); }

    else {
      let m = await aiModels(cli, r.ac.signal), got;

      try { got = await cli.write(list(m), req, r.ac.signal); }
      catch (e) { if (e.kind !== 'model') throw e; m = await aiModels(cli, r.ac.signal, true); got = await cli.write(list(m), req, r.ac.signal); }

// Opens a brief made earlier today, from what's kept on this phone. Nothing is asked of Gemini: one whose

async function openPast(key) {

  stopRun();
  unlock();

    state: 'ready', err: null, ttsErr: null, ac: new AbortController(), playing: false, waiting: false, done: false, started: now(), again: true };
  r.parts = Gm.parts(r.brief).map((x) => Object.assign(x, { state: 'wait', url: '' }));
  openAI();
  const base = clipBase(r);
  for (let i = 0; i < r.parts.length; i++) {
    const hit = await DB.get(base + '#' + i);
    if (run !== r) return;
    if (!hit || !hit.blob) break;

async function record(r, cli) {
  const base = clipBase(r);

    if (run !== r) return;
    const p = r.parts[i];
    p.state = 'making';
    paintAI();
    let blob = null;
    const hit = await DB.get(base + '#' + i);
    if (hit && hit.blob) blob = hit.blob;
    else {
      try {
        const m = await aiModels(cli, r.ac.signal);
        const got = await cli.speak(m.tts, r.voice, p.text, AI.form, r.ac.signal);

        p.state = 'failed'; r.ttsErr = e;
        if (r.state === 'recording') r.state = 'ready';   // nothing recorded: the written brief stands on its own
        r.parts.slice(i + 1).forEach((x) => { x.state = 'failed'; });
        if (r.waiting) r.waiting = false;

    }
    if (run !== r) return;
    p.url = URL.createObjectURL(blob);

    else if (r.waiting && r.i === i) playPart(i);

function stopRun() {
  const r = run;
  run = null;
  if (!r) return;
  try { r.ac.abort(); } catch (e) { /* already stopped */ }
  if (!isSilence()) { aud.pause(); aud.removeAttribute('src'); aud.load(); }
  r.parts.forEach((p) => { if (p.url) URL.revokeObjectURL(p.url); });

/* Playing */
function playPart(i) {

  const p = r.parts[i];

    if (r.again && p.state === 'wait') recordRest(r);   // an earlier brief, asked for out loud
    r.waiting = p.state !== 'failed'; if (!isSilence()) aud.pause(); paintAI(); return;
  }
  r.waiting = false;
  aud.src = p.url;
  aud.playbackRate = AI.rate || 1;
  const pr = aud.play();
  if (pr) pr.catch(() => { if (run === r) { r.playing = false; paintAI(); } });
  mediaMeta();
  paintAI();
  // Keep the part being read in view

}
function aiToggle() {

}
function aiSkip(d) {

}
function mediaMeta() {

    navigator.mediaSession.metadata = new MediaMetadata({ title: run.brief.title, artist: NAME + ' · ' + run.label, album: 'Brief me',
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }, { src: 'icon-192.png', sizes: '192x192', type: 'image/png' }] });
    const h = { play: () => aiToggle(), pause: () => aud.pause(), previoustrack: () => aiSkip(-1), nexttrack: () => aiSkip(1), stop: () => stopRun() };

let lastTick = 0;
aud.addEventListener('timeupdate', () => { if (!run || isSilence() || now() - lastTick < 450) return; lastTick = now(); paintTime(); });

/* The sheet */
const sheetIs = (k) => sheet.open && sheet.dataset.kind === k;
const mmss = (s) => (isFinite(s) && s > 0 ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00');
const timeTxt = () => (aud.getAttribute('src') && !isSilence() ? `${mmss(aud.currentTime)} / ${mmss(aud.duration)}` : '');
function partTxt() {

  if (r.state === 'recording') return `${spin}Recording it in ${esc(r.voice)}’s voice…`;

// The other briefs made today, so changing the filters doesn't put one out of reach

// One button, named for what it would do: catch up with the filters, or write this one again

/* Drag a sheet down by its top band, or swipe it right, to close it */
(function sheetGestures() {
  let g = null;
  const scrollsSideways = (el) => {
    for (let n = el; n && n !== sheet; n = n.parentElement) {
      const ox = getComputedStyle(n).overflowX;
      if ((ox === 'auto' || ox === 'scroll') && n.scrollWidth > n.clientWidth) return true;
    }
    return false;
  };
  sheet.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || e.target.closest('input, textarea, select') || scrollsSideways(e.target)) { g = null; return; }
    if (String(getSelection && getSelection()).length) { g = null; return; }
    const p = e.touches[0];
    const top = sheet.getBoundingClientRect().top;
    const handle = !!e.target.closest('.grabber, .sheet-head, .welcome h2') || p.clientY - top < 56;
    g = { x0: p.clientX, y0: p.clientY, t0: e.timeStamp, dir: null, handle, dx: 0, dy: 0 };
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!g) return;
    const p = e.touches[0], dx = p.clientX - g.x0, dy = p.clientY - g.y0;
    if (!g.dir) {
      if (Math.hypot(dx, dy) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) && dx > 0) g.dir = 'x';
      else if (dy > 0 && Math.abs(dy) > Math.abs(dx) && g.handle) g.dir = 'y';
      else { g = null; return; }
    }
    e.preventDefault();
    g.dx = dx; g.dy = dy; g.t = e.timeStamp;
    if (reduced()) return;
    sheet.classList.remove('springing');
    sheet.style.transform = g.dir === 'x' ? `translateX(${Math.max(0, dx)}px)` : `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });
  const end = () => {
    if (!g || !g.dir) { g = null; return; }
    const d = g.dir === 'x' ? g.dx : g.dy, size = g.dir === 'x' ? sheet.offsetWidth / 3 : sheet.offsetHeight / 4;
    const v = d / Math.max(1, (g.t || g.t0) - g.t0);
    const go = d > size || v > 0.5;
    const dir = g.dir;
    g = null;
    if (go) {
      if (reduced()) { closeSheet(); return; }
      sheet.classList.add('springing');
      sheet.style.transform = dir === 'x' ? 'translateX(110%)' : 'translateY(110%)';
      setTimeout(() => { sheet.classList.remove('springing'); closeSheet(); }, 200);
    } else {
      sheet.classList.add('springing');
      sheet.style.transform = '';
      setTimeout(() => sheet.classList.remove('springing'), 240);
    }
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
})();

/* ---------- Light and dark ---------- */
const theme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').setAttribute('content', BAR[t]);
  const next = t === 'dark' ? 'light' : 'dark';
  const b = $('#themeBtn');
  b.innerHTML = icon(next);
  b.setAttribute('aria-label', `Switch to ${next} theme`);
  b.title = `${next === 'dark' ? 'Dark' : 'Light'} theme`;
}
// Follow the phone until the person chooses
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => { if (!S.set.theme) applyTheme(e.matches ? 'dark' : 'light'); });

/* ---------- Search ---------- */
function openSearch() {
  if (S.searching) { $('#q').focus(); return; }
  S.searching = true;
  document.documentElement.classList.add('searching');
  setPill(true);
  $('#searchRow').hidden = false;
  $('#searchBtn').setAttribute('aria-expanded', 'true');
  history.pushState({ search: 1 }, '');
  $('#q').focus();
  if (S.arch === 'idle') loadArchive();   // search reaches back three months
}
function closeSearch(fromPop) {
  if (!S.searching) return;
  S.searching = false; S.q = ''; S.days = DAYS_STEP;
  document.documentElement.classList.remove('searching');
  $('#q').value = '';
  $('#searchRow').hidden = true;
  $('#searchBtn').setAttribute('aria-expanded', 'false');
  if (!fromPop && history.state && history.state.search) history.back();
  render();
}
$('#q').addEventListener('input', () => { S.q = $('#q').value; S.open = null; S.days = DAYS_STEP; render(); });
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });
window.addEventListener('popstate', () => {
  if (L.open && !(history.state && history.state.learn)) { closeLearn(true); return; }
  if (S.searching) closeSearch(true);
});

/* ---------- Share ---------- */
async function share() {
  const data = { title: NAME, text: 'What’s new across Google, twice a day. Free for the Google developer community.', url: APP_URL };
  try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(APP_URL); toast('Link copied'); }
  catch { toast('Copy this link: ' + APP_URL); }
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.view) {
    if (d.view === S.view) { scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }); return; }   // tapping the current view goes back to its top
    freshView();
    S.view = d.view; put('view', S.view); S.open = null; S.onlyNew = false; S.days = DAYS_STEP;
    scrollTo({ top: 0 });
    setPill(true);
    render();
    return;
  }
  if (d.period) { setPeriod(d.period); return; }
  if (d.subject) { chooseSubject(d.subject); return; }
  if (d.topic) {
    const on = S.topics.indexOf(d.topic) >= 0;
    setTopics(on ? S.topics.filter((x) => x !== d.topic) : S.topics.concat([d.topic]));
    return;
  }
  if (d.open) { S.open = S.open === d.open ? null : d.open; renderList(); reveal(); return; }
  if (d.more) { S.more[d.more] = !S.more[d.more]; renderList(); reveal(); return; }
  if (d.star) {
    const it = findItem(d.star);
    if (!it) return;
    if (S.stars[it.id]) { delete S.stars[it.id]; toast('Removed from Starred'); }
    else {
      const keep = Object.assign({}, it, { srcName: S.brief ? S.brief.srcName[it.src] : it.srcName, starredAt: now() });
      delete keep.v; delete keep.ar;
      S.stars[it.id] = keep; toast('Starred. It stays under Starred.');
    }
    put('stars', S.stars);
    document.querySelectorAll(`[data-star="${CSS.escape(it.id)}"]`).forEach((b) => {
      const on = !!S.stars[it.id];
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', on ? 'Starred. Tap to remove' : 'Star this update');
    });
    renderNav();
    if (S.view === 'stars') { renderList(); renderTail(); reveal(); }
    return;
  }
  if (d.dismiss) { const x = get('dismissed', {}); x[d.dismiss] = 1; put('dismissed', x); renderNotices(); return; }
  if (d.goto) { revealItem(d.goto); return; }
  if (d.voice) { AI.voice = d.voice; saveAI(); paintSet(); return; }
  if (d.setlen) { AI.len = d.setlen; saveAI(); paintSet(); return; }
  if (d.ailen) { if (d.ailen !== AI.len) { AI.len = d.ailen; saveAI(); aiStart(); } return; }
  if (d.aipast) { openPast(d.aipast); return; }
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'retry': load(); break;
    case 'archive': S.arch = 'idle'; loadArchive(); break;
    case 'topics': openTopics(); break;
    case 'learn': openLearn(); break;
    case 'learn-close': closeLearn(); break;
    case 'learn-pick': openPicker(); break;
    case 'learn-next': cardNext(); break;
    case 'learn-share': shareSet(); break;
    case 'clear-topics': setTopics([]); break;
    case 'only-new': S.onlyNew = !S.onlyNew; S.open = null; S.days = DAYS_STEP; freshView(); render(); break;
    case 'quiet': S.set.quiet = !S.set.quiet; saveSet(); t.setAttribute('aria-checked', String(S.set.quiet)); render(); break;
    case 'welcome': openWelcome(); break;
    case 'share': share(); break;
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; renderNotices(); } break;
    case 'ai': aiOpen(); break;
    case 'ai-now': aiStart(); break;
    case 'ai-new': aiStart(true); break;
    case 'ai-open': openAI(); break;
    case 'ai-play': aiToggle(); break;
    case 'ai-prev': aiSkip(-1); break;
    case 'ai-next': aiSkip(1); break;
    case 'ai-stop': stopRun(); break;
    case 'ai-rate': AI.rate = RATES[(RATES.indexOf(AI.rate || 1) + 1) % RATES.length]; saveAI(); aud.playbackRate = AI.rate; paintAI(); break;
    case 'ai-settings': openSettings(); setTimeout(() => { const h = $('#aiSetHead'); if (h) h.scrollIntoView({ block: 'start' }); }, 50); break;
    case 'key-test': testKey(); break;
    case 'key-remove': removeKey(); break;
  }
});
$('#settingsBtn').addEventListener('click', () => openSettings());
$('#themeBtn').addEventListener('click', () => { const t = theme() === 'dark' ? 'light' : 'dark'; S.set.theme = t; saveSet(); applyTheme(t); });
$('#searchBtn').addEventListener('click', () => (S.searching ? closeSearch() : openSearch()));
$('#searchClose').addEventListener('click', () => closeSearch());
// A thumbnail that can't load leaves a plain tile
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.remove(); }, true);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || sheet.open) return;
  if (L.open) closeLearn(); else if (S.searching) closeSearch();
});
$('#period').addEventListener('keydown', (e) => {
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!step) return;
  e.preventDefault();
  const i = C.PERIODS.findIndex((p) => p.id === S.period);
  const next = C.PERIODS[(i + step + C.PERIODS.length) % C.PERIODS.length].id;
  setPeriod(next);
  $(`#period [data-period="${next}"]`).focus();
});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; renderNotices(); });
window.addEventListener('online', () => load());
window.addEventListener('offline', renderNotices);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (now() - S.fetchedAt > 10 * 60e3) load(); else render();
});

/* ---------- Start ---------- */
$('#searchBtn').innerHTML = icon('search');
$('#settingsBtn').innerHTML = icon('tune');
$('#searchIcon').innerHTML = icon('search');
$('#searchClose').innerHTML = icon('close');
applyTheme(theme());
// The tools start tucked in, then glide out of the pill
setPill(false);
if (!reduced()) { pill.classList.remove('open'); $('#pillTools').inert = true; setTimeout(() => setPill(true), 350); }
load();
if (!get('welcomed', 0)) openWelcome();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
